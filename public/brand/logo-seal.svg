<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="SportBridge Global Seal">
  <defs>
    <linearGradient id="sealGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2C58A"/>
      <stop offset="50%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#A8843F"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="112" stroke="url(#sealGold)" stroke-width="1.5" fill="#0E2F2A"/>
  <circle cx="120" cy="120" r="98" stroke="url(#sealGold)" stroke-width="0.8" opacity="0.55"/>
  <circle cx="120" cy="120" r="72" stroke="url(#sealGold)" stroke-width="1" opacity="0.35"/>
  <!-- Bridge -->
  <g transform="translate(72,78)">
    <path d="M12 68 V28" stroke="url(#sealGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M84 68 V28" stroke="url(#sealGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 32 C30 4, 66 4, 84 32" stroke="url(#sealGold)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M12 44 H84" stroke="url(#sealGold)" stroke-width="2"/>
    <path d="M24 44 V60" stroke="url(#sealGold)" stroke-width="1.6" opacity="0.75"/>
    <path d="M48 44 V60" stroke="url(#sealGold)" stroke-width="1.6" opacity="0.75"/>
    <path d="M72 44 V60" stroke="url(#sealGold)" stroke-width="1.6" opacity="0.75"/>
    <circle cx="48" cy="18" r="3.5" fill="url(#sealGold)"/>
  </g>
  <!-- Arc text via paths -->
  <path id="topArc" d="M40 120 A80 80 0 0 1 200 120" fill="none"/>
  <path id="bottomArc" d="M200 120 A80 80 0 0 1 40 120" fill="none"/>
  <text fill="#C6A15B" font-family="Syne, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">SPORTBRIDGE GLOBAL</textPath>
  </text>
  <text fill="#D9DDE1" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="3.5">
